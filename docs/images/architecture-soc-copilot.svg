<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="net" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#3a8bff"/></marker>
    <marker id="log" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#cfd6e4"/></marker>
    <marker id="loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2ecc71"/></marker>
  </defs>

  <rect width="1500" height="820" fill="#0d1017"/>
  <text x="40" y="44" fill="#fff" font-size="24" font-weight="700">Architecture — SOC-Copilot</text>
  <text x="40" y="68" fill="#7b869c" font-size="13">SOC open-source : Détection (Wazuh) · SOAR (n8n) · Threat Intelligence (AbuseIPDB + MISP) · IA locale (Ollama) · Gestion d'incident (TheHive)</text>

  <!-- Legend -->
  <rect x="1230" y="28" width="235" height="78" rx="8" fill="#141821" stroke="#333b4d"/>
  <line x1="1248" y1="52" x2="1300" y2="52" stroke="#3a8bff" stroke-width="2.5" marker-end="url(#net)"/>
  <text x="1310" y="56" fill="#cfd6e4" font-size="12">Trafic réseau / attaque</text>
  <line x1="1248" y1="82" x2="1300" y2="82" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <text x="1310" y="86" fill="#cfd6e4" font-size="12">Logs / Données</text>

  <!-- ================= Attacker ================= -->
  <rect x="330" y="95" width="250" height="78" rx="10" fill="#15202e" stroke="#e05555" stroke-width="2"/>
  <text x="455" y="128" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">💀 Kali Linux — Attaquant</text>
  <text x="455" y="150" fill="#ff9a9a" font-size="12" text-anchor="middle">192.168.50.10 · Injection SQL, scan…</text>

  <!-- ================= Agents group ================= -->
  <rect x="40" y="210" width="250" height="470" rx="12" fill="#10151e" stroke="#333b4d"/>
  <text x="60" y="238" fill="#9fb0cc" font-size="14" font-weight="700">AGENTS (surveillés)</text>

  <rect x="60" y="255" width="210" height="130" rx="10" fill="#1b2330" stroke="#3aa0ff" stroke-width="2"/>
  <text x="165" y="285" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">🖥️ SRV-WEB (Ubuntu)</text>
  <text x="165" y="308" fill="#bcd0ee" font-size="11.5" text-anchor="middle">DVWA — application cible</text>
  <text x="165" y="328" fill="#bcd0ee" font-size="11.5" text-anchor="middle">🐺 Agent Wazuh</text>
  <text x="165" y="352" fill="#7b869c" font-size="10.5" text-anchor="middle">LAN 192.168.50.40</text>
  <text x="165" y="368" fill="#7b869c" font-size="10.5" text-anchor="middle">SOC 192.168.30.40</text>

  <rect x="60" y="410" width="210" height="130" rx="10" fill="#1b2330" stroke="#3aa0ff" stroke-width="2"/>
  <text x="165" y="440" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">🪟 Windows 11</text>
  <text x="165" y="463" fill="#bcd0ee" font-size="11.5" text-anchor="middle">Poste utilisateur</text>
  <text x="165" y="483" fill="#bcd0ee" font-size="11.5" text-anchor="middle">Sysmon + 🐺 Agent Wazuh</text>
  <text x="165" y="507" fill="#7b869c" font-size="10.5" text-anchor="middle">Réseau SOC</text>

  <text x="60" y="585" fill="#7b869c" font-size="11">Segmentation réseau :</text>
  <text x="60" y="604" fill="#ff9a9a" font-size="11">• LAN 192.168.50.x (attaquant)</text>
  <text x="60" y="622" fill="#8fe3b0" font-size="11">• SOC 192.168.60.x (outils)</text>
  <text x="60" y="640" fill="#7b869c" font-size="10.5">L'attaquant n'atteint pas</text>
  <text x="60" y="656" fill="#7b869c" font-size="10.5">le réseau SOC.</text>

  <!-- ================= Wazuh ================= -->
  <rect x="360" y="225" width="340" height="190" rx="12" fill="#10151e" stroke="#3aa0ff" stroke-width="2"/>
  <text x="530" y="252" fill="#3aa0ff" font-size="15" font-weight="700" text-anchor="middle">WAZUH — SIEM</text>
  <rect x="380" y="265" width="95" height="60" rx="8" fill="#1b2330" stroke="#3aa0ff"/>
  <text x="427" y="300" fill="#fff" font-size="12" text-anchor="middle">W. Server</text>
  <rect x="482" y="265" width="95" height="60" rx="8" fill="#1b2330" stroke="#3aa0ff"/>
  <text x="529" y="300" fill="#fff" font-size="12" text-anchor="middle">W. Indexer</text>
  <rect x="584" y="265" width="96" height="60" rx="8" fill="#1b2330" stroke="#3aa0ff"/>
  <text x="632" y="293" fill="#fff" font-size="12" text-anchor="middle">W.</text>
  <text x="632" y="309" fill="#fff" font-size="12" text-anchor="middle">Dashboard</text>
  <text x="530" y="355" fill="#bcd0ee" font-size="11.5" text-anchor="middle">Règles custom (100200, 100300/301, 100400)</text>
  <text x="530" y="374" fill="#bcd0ee" font-size="11.5" text-anchor="middle">Corrélation · Mapping MITRE ATT&amp;CK</text>
  <text x="530" y="397" fill="#8fe3b0" font-size="11" text-anchor="middle">+ Liste CDB d'IOC (7400+) synchronisée depuis MISP</text>

  <!-- ================= n8n SOAR ================= -->
  <rect x="360" y="470" width="340" height="150" rx="12" fill="#10151e" stroke="#ea4b71" stroke-width="2"/>
  <text x="530" y="498" fill="#ea4b71" font-size="15" font-weight="700" text-anchor="middle">⚙️ n8n — SOAR</text>
  <text x="530" y="524" fill="#e7c2cf" font-size="12" text-anchor="middle">Reçoit l'alerte (webhook) · Tri par gravité</text>
  <text x="530" y="544" fill="#e7c2cf" font-size="12" text-anchor="middle">Fiche d'incident · Orchestration</text>
  <text x="530" y="568" fill="#e7c2cf" font-size="12" text-anchor="middle">Enrichit, décide, déclenche la réponse</text>
  <text x="530" y="596" fill="#7b869c" font-size="11" text-anchor="middle">Intégration Wazuh → n8n (custom-n8n)</text>

  <!-- ================= Threat Intel ================= -->
  <rect x="760" y="225" width="300" height="190" rx="12" fill="#10151e" stroke="#a66bd6" stroke-width="2"/>
  <text x="910" y="252" fill="#a66bd6" font-size="15" font-weight="700" text-anchor="middle">THREAT INTELLIGENCE</text>
  <rect x="780" y="268" width="260" height="62" rx="8" fill="#2a1d16" stroke="#e8923a"/>
  <text x="910" y="294" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">🌐 AbuseIPDB</text>
  <text x="910" y="314" fill="#e8c3a0" font-size="11" text-anchor="middle">TI EXTERNE — réputation mondiale IP</text>
  <rect x="780" y="340" width="260" height="62" rx="8" fill="#241a35" stroke="#a66bd6"/>
  <text x="910" y="366" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">🧠 MISP</text>
  <text x="910" y="386" fill="#d7c2ea" font-size="11" text-anchor="middle">TI INTERNE — IOC connus (feeds réels)</text>

  <!-- ================= Agent IA ================= -->
  <rect x="760" y="470" width="300" height="150" rx="12" fill="#10151e" stroke="#2ecc71" stroke-width="2"/>
  <text x="910" y="498" fill="#2ecc71" font-size="15" font-weight="700" text-anchor="middle">🤖 AGENT IA — Ollama</text>
  <text x="910" y="524" fill="#bfe8cf" font-size="12" text-anchor="middle">Modèle qwen2.5 — 100 % LOCAL</text>
  <text x="910" y="546" fill="#bfe8cf" font-size="12" text-anchor="middle">Résume l'alerte + recommandation</text>
  <text x="910" y="570" fill="#bfe8cf" font-size="12" text-anchor="middle">RAG sur base de connaissances SOC</text>
  <text x="910" y="596" fill="#7b869c" font-size="11" text-anchor="middle">Souveraineté des données (aucun cloud)</text>

  <!-- ================= Response / Incident ================= -->
  <rect x="1120" y="225" width="340" height="395" rx="12" fill="#10151e" stroke="#ffb400" stroke-width="2"/>
  <text x="1290" y="252" fill="#ffb400" font-size="15" font-weight="700" text-anchor="middle">RÉPONSE &amp; GESTION D'INCIDENT</text>

  <rect x="1145" y="270" width="290" height="90" rx="10" fill="#231c33" stroke="#ffb400"/>
  <text x="1290" y="302" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📁 TheHive</text>
  <text x="1290" y="324" fill="#ead9b0" font-size="11.5" text-anchor="middle">Création AUTO de cas d'investigation</text>
  <text x="1290" y="344" fill="#ead9b0" font-size="11.5" text-anchor="middle">Observables · Tâches · MTTD / MTTR</text>

  <rect x="1145" y="375" width="290" height="80" rx="10" fill="#15283a" stroke="#29a9ea"/>
  <text x="1290" y="407" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">📱 Telegram</text>
  <text x="1290" y="429" fill="#b7def5" font-size="11.5" text-anchor="middle">Notification temps réel à l'analyste</text>

  <rect x="1145" y="470" width="290" height="130" rx="10" fill="#141821" stroke="#333b4d"/>
  <text x="1290" y="498" fill="#9fb0cc" font-size="13" font-weight="700" text-anchor="middle">🔁 Boucles intelligentes</text>
  <text x="1290" y="523" fill="#8fe3b0" font-size="11.5" text-anchor="middle">1) n8n ré-injecte l'IP dans MISP</text>
  <text x="1290" y="541" fill="#8fe3b0" font-size="11.5" text-anchor="middle">→ le SOC apprend (boucle fermée)</text>
  <text x="1290" y="565" fill="#8fe3b0" font-size="11.5" text-anchor="middle">2) MISP → liste CDB → Wazuh</text>
  <text x="1290" y="583" fill="#8fe3b0" font-size="11.5" text-anchor="middle">→ détection native d'IOC (règle 100400)</text>

  <!-- ================= Arrows ================= -->
  <!-- Kali attacks SRV-WEB -->
  <path d="M330 150 C 220 180, 190 210, 180 250" fill="none" stroke="#3a8bff" stroke-width="2.5" marker-end="url(#net)"/>
  <!-- Agents -> Wazuh (logs) -->
  <path d="M270 320 C 320 300, 330 300, 360 300" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <path d="M270 470 C 330 430, 335 360, 360 335" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <!-- Wazuh -> n8n -->
  <path d="M530 415 V 470" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <!-- n8n -> Threat Intel -->
  <path d="M700 520 C 740 450, 745 400, 780 380" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <path d="M700 510 C 740 420, 745 320, 780 300" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <!-- n8n -> Agent IA -->
  <path d="M700 545 H 760" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <!-- n8n -> Response (TheHive + Telegram) -->
  <path d="M700 500 C 950 440, 1000 330, 1145 310" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <path d="M700 530 C 980 470, 1000 410, 1145 410" fill="none" stroke="#cfd6e4" stroke-width="2.5" marker-end="url(#log)"/>
  <!-- closed loop MISP <-> n8n -->
  <path d="M780 395 C 740 450, 710 470, 700 490" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#loop)"/>
  <!-- MISP -> Wazuh (CDB) -->
  <path d="M780 350 C 720 330, 700 330, 700 340" fill="none" stroke="#2ecc71" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#loop)"/>
  <text x="712" y="445" fill="#2ecc71" font-size="10">boucle fermée</text>
</svg>
